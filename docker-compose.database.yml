services:
  # PostgreSQL database for ISG Pro cluster
  postgres:
    image: postgres:18.4
    container_name: isg-postgres
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - autovacuum_vacuum_scale_factor=0.02
      - -c
      - autovacuum_analyze_scale_factor=0.01
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=lz4
      - -c
      - log_min_duration_statement=250
      - -c
      - log_autovacuum_min_duration=1s
      - -c
      - log_lock_waits=on
    stop_grace_period: 120s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ISG_DB_USER: ${ISG_DB_USER}
      ISG_DB_PASSWORD: ${ISG_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - isg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # pgBouncer connection pooler
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: isg-pgbouncer
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${ISG_DB_USER}
      - DB_PASSWORD=${ISG_DB_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=50
      - MAX_CLIENT_CONN=1000
      - ADMIN_USERS=
      - AUTH_TYPE=scram-sha-256
      - LISTEN_PORT=6432
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - LOG_STATS=1
    ports:
      - "${PGBOUNCER_HOST}:${PGBOUNCER_PORT}:6432"
    networks:
      - isg-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z pgbouncer 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  isg-network:
    driver: bridge

volumes:
  postgres_data:
